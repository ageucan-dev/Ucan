name: Build landing page for Hostinger

on:
  push:
    branches:
      - lp-negocios-locais-v2

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out landing page
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Export static site with Next.js
        run: npx next build
      - name: Inspect export
        run: |
          echo "Files generated in out:"
          find out -maxdepth 4 -type f -print | sort | head -100
          test -f out/index.html
      - name: Save static files
        uses: actions/upload-artifact@v4
        with:
          name: ucan-negocios-locais-hostinger
          path: out/
          if-no-files-found: error
          retention-days: 3
